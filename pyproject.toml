[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "unified-model-index"
version = "0.1.0"
description = "Transparent, auditable scoring for AI model capability, efficiency, economics, and value."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=2.1,<2.3",
  "pandas>=2.2,<4",
  "pydantic>=2.10,<3",
  "pyyaml>=6.0,<7",
  "scipy>=1.14,<2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pandas-stubs>=2.2,<3",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "types-pyyaml>=6.0,<7",
]

[project.scripts]
umi = "umi.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["umi", "analysis"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=umi --cov=analysis --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["umi", "analysis"]

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
ignore_missing_imports = true
